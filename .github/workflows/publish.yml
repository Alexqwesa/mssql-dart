name: CI / Publish

on:
  push:
    branches: [mssql_native]
    tags:
      - 'v[0-9]*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    uses: ./.github/workflows/native-tls-build.yml

  # Verify in-repo SHA-256 pins against CI binaries (see DEV_README.md).
  # Pin commits + tagging are done by the manual Release workflow.
  native-tls-pins:
    name: Native TLS pins
    needs: [native-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-tls-*
          path: native-assets
      - name: Stage artifacts for dart build hooks
        run: bash tool/stage_ci_native_tls.sh native-assets
      - run: dart pub get
      - name: Propose pins from CI artifacts
        run: |
          mkdir -p proposed-pins
          dart run tool/update_native_tls_pins.dart \
            --from-dir native-assets \
            --require-all \
            --output proposed-pins/native_tls_pins.dart
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-native-tls-pins
          path: proposed-pins/native_tls_pins.dart
          if-no-files-found: error
      - name: Verify in-repo pins (branch / PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          dart run tool/update_native_tls_pins.dart \
            --from-dir native-assets \
            --check
      - name: Verify in-repo pins match release binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dart run tool/update_native_tls_pins.dart \
            --from-dir native-assets \
            --check \
            --require-all

  release-native-assets:
    name: Release native TLS assets
    needs: [native-tls-pins]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-tls-*
          path: native-assets
      - name: Pack release zips
        run: |
          set -euo pipefail
          mkdir -p release-binaries
          for asset in native-assets/*; do
            name="$(basename "$asset")"
            (cd "$asset" && zip -r "$GITHUB_WORKSPACE/release-binaries/${name}.zip" .)
            # Flatten libraries for per-binary attestations (same bytes as zip members).
            case "$name" in
              mssql-tls-linux-x64)
                cp "$asset/libmssql_tls.so" release-binaries/linux-x64-libmssql_tls.so
                ;;
              mssql-tls-windows-x64)
                cp "$asset/mssql_tls.dll" release-binaries/windows-x64-mssql_tls.dll
                ;;
              mssql-tls-android)
                cp "$asset/arm64-v8a/libmssql_tls.so" \
                  release-binaries/android-arm64-v8a-libmssql_tls.so
                cp "$asset/armeabi-v7a/libmssql_tls.so" \
                  release-binaries/android-armeabi-v7a-libmssql_tls.so
                cp "$asset/x86_64/libmssql_tls.so" \
                  release-binaries/android-x86_64-libmssql_tls.so
                ;;
            esac
          done
          ls -la release-binaries
      - name: Attest release zips and binaries
        uses: actions/attest@v4
        with:
          subject-path: |
            release-binaries/*.zip
            release-binaries/linux-x64-libmssql_tls.so
            release-binaries/windows-x64-mssql_tls.dll
            release-binaries/android-arm64-v8a-libmssql_tls.so
            release-binaries/android-armeabi-v7a-libmssql_tls.so
            release-binaries/android-x86_64-libmssql_tls.so
      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-binaries/*.zip --clobber

  # ════════════════════════════════════════════════════════════════════════════
  # 1 · Static analysis
  # ════════════════════════════════════════════════════════════════════════════
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get
      - run: dart analyze --fatal-warnings

  # ════════════════════════════════════════════════════════════════════════════
  # 2 · Protocol / API unit tests (no SQL Server required)
  #     Covers go-mssqldb-style buffer + PreLogin mock-server tests so
  #     packet-boundary regressions fail fast without Docker.
  # ════════════════════════════════════════════════════════════════════════════
  unit:
    name: Unit tests
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get
      - name: Run unit tests
        run: |
          dart test \
            test/unit_test.dart \
            test/tds_buffer_test.dart \
            test/mock_prelogin_test.dart \
            test/login7_encode_test.dart \
            test/token_stream_test.dart \
            test/type_decode_test.dart \
            test/rpc_encode_test.dart \
            test/mock_full_login_test.dart \
            test/attention_cancel_test.dart \
            test/native_tls_transport_test.dart \
            test/ntlm_auth_test.dart \
            test/azure_ad_auth_test.dart \
            test/mock_sspi_login_test.dart \
            test/pool_ntlm_config_test.dart \
            test/pool_azure_ad_config_test.dart \
            test/pool_stats_test.dart \
            test/mock_fedauth_login_test.dart \
            test/timeout_unit_test.dart \
            test/named_instance_test.dart \
            test/connection_string_test.dart \
            test/bulk_encode_test.dart \
            test/tvp_encode_test.dart \
            test/transient_test.dart \
            test/isolation_test.dart \
            test/typed_values_test.dart \
            test/keepalive_session_init_test.dart \
            --timeout=60s

  # ════════════════════════════════════════════════════════════════════════════
  # 3b · Forced-TLS stress (custom image with forceencryption=1)
  # ════════════════════════════════════════════════════════════════════════════
  test-tls-force:
    name: Test (forceencryption TLS)
    needs: [analyze, unit, native-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get
      - name: Start live SQL Servers (optional TLS + forceencryption)
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.live.yml \
            up -d --build
      - name: Wait for optional and force-encryption SQL Servers
        run: |
          for i in $(seq 1 60); do
            if docker exec mssql-dart-live /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'Strong_test_password_123!' \
              -Q 'SELECT 1' -No -C >/dev/null 2>&1 \
              && docker exec mssql-dart-live-force-tls /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'Strong_test_password_123!' \
              -Q 'SELECT 1' -No -C >/dev/null 2>&1; then
              echo "both SQL Servers are ready"
              exit 0
            fi
            echo "waiting ($i)..."
            sleep 5
          done
          echo "SQL Server did not become ready"
          docker compose -f docker-compose.live.yml logs
          exit 1
      - name: Run force-encryption TLS stress
        env:
          MSSQL_LIVE_TESTS: "1"
          MSSQL_HOST: "127.0.0.1"
          MSSQL_USER: "sa"
          MSSQL_PASSWORD: "Strong_test_password_123!"
          MSSQL_TRUST_SERVER_CERTIFICATE: "1"
        run: |
          set -o pipefail
          dart test \
            test/live/tls_certificate_live_test.dart \
            test/live/tls_force_encrypt_stress_test.dart \
            test/live/connection_churn_live_test.dart \
            --concurrency=1 --timeout=120s --reporter=expanded \
            | tee force-tls-test.log
          ! grep -Eq '~[1-9][0-9]*' force-tls-test.log
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.live.yml down -v

  # ════════════════════════════════════════════════════════════════════════════
  # 3 · Full test suite against a live SQL Server 2022 container
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test (SQL Server 2022)
    needs: [analyze, unit]
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Strong_test_password_123!"
          MSSQL_PID: Developer
        ports:
          - "14333:1433"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong_test_password_123!' -Q 'SELECT 1' -No -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get
      - name: Run tests
        env:
          MSSQL_LIVE_TESTS: "1"
          MSSQL_HOST: "127.0.0.1"
          MSSQL_PORT: "14333"
          MSSQL_USER: "sa"
          MSSQL_PASSWORD: "Strong_test_password_123!"
        run: |
          set -o pipefail
          # Exclude standalone scripts that don't use package:test
          TEST_FILES=$(find test -name '*_test.dart' \
            ! -name 'debug_test.dart' \
            ! -name 'integration_test.dart' \
            ! -name 'tls_certificate_live_test.dart' \
            ! -name 'connection_churn_live_test.dart' \
            | sort | tr '\n' ' ')
          dart test $TEST_FILES --timeout=90s --reporter=expanded \
            | tee sql-server-test.log
          ! grep -Eq '~[1-9][0-9]*' sql-server-test.log

  # ════════════════════════════════════════════════════════════════════════════
  # 4 · Publish to pub.dev  (tag pushes only, after tests pass)
  #
  # One-time setup required:
  #   pub.dev → package → Settings → "Automated publishing"
  #   → add this repo + environment name "pub.dev"
  # ════════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish to pub.dev
    needs: [test, test-tls-force, release-native-assets]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pub.dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get

      - name: Dry-run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force
