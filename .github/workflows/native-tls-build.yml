# Reusable Windows / Linux / Android / Apple native TLS helper builds.
name: Native TLS build

on:
  workflow_call:

jobs:
  native-tls:
    name: Native TLS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            library: mssql_tls.dll
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
            library: libmssql_tls.so
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Install Windows OpenSSL (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey OpenSSL layouts vary and often break FindOpenSSL on
          # current CMake; the runner's vcpkg install is stable.
          vcpkg install openssl:x64-windows-static-md
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static-md'
          if (-not (Test-Path (Join-Path $prefix 'include\openssl\ssl.h'))) {
            throw "OpenSSL headers missing under $prefix"
          }
          # Forward slashes avoid quoting issues when the next step uses bash.
          $prefixUnix = $prefix -replace '\\', '/'
          "OPENSSL_ROOT_DIR=$prefixUnix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$prefixUnix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OPENSSL_ROOT_DIR=$prefixUnix"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with: { arch: x64 }
      - name: Configure and test native helper
        shell: bash
        run: |
          cmake -S native -B build/native -G Ninja -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"} \
            ${CMAKE_PREFIX_PATH:+-DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"}
          cmake --build build/native --config Release
          ctest --test-dir build/native --output-on-failure
      - name: Stage Windows native asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows-x64, native/bin/windows-x64 | Out-Null
          Copy-Item build/native/mssql_tls.dll dist/windows-x64/mssql_tls.dll
          Copy-Item THIRD_PARTY_NOTICES.md dist/windows-x64/THIRD_PARTY_NOTICES.md
          Copy-Item build/native/mssql_tls.dll native/bin/windows-x64/mssql_tls.dll
          (Get-FileHash dist/windows-x64/mssql_tls.dll -Algorithm SHA256).Hash.ToLower() + '  mssql_tls.dll' |
            Set-Content dist/windows-x64/SHA256SUMS
      - name: Stage Linux native asset
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/linux-x64 native/bin/linux-x64
          cp build/native/libmssql_tls.so dist/linux-x64/libmssql_tls.so
          cp THIRD_PARTY_NOTICES.md dist/linux-x64/THIRD_PARTY_NOTICES.md
          cp build/native/libmssql_tls.so native/bin/linux-x64/libmssql_tls.so
          (cd dist/linux-x64 && sha256sum libmssql_tls.so > SHA256SUMS)
      - name: Run Dart native TLS smoke test
        run: |
          dart pub get
          dart test test/native_tls_engine_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: mssql-tls-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error

  android-native-tls:
    name: Native TLS (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v3 defaults to the removed SDK package `tools` and fails with
      # "Failed to find package 'tools'". v4 installs platform-tools only.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build Android native helpers
        run: bash tool/build_android_native.sh
      - name: Inspect Android helpers
        run: |
          find dist/android -name libmssql_tls.so -print -exec file {} \;
          test -f dist/android/arm64-v8a/libmssql_tls.so
          test -f dist/android/armeabi-v7a/libmssql_tls.so
          test -f dist/android/x86_64/libmssql_tls.so
      - uses: actions/upload-artifact@v4
        with:
          name: mssql-tls-android
          path: dist/android/
          if-no-files-found: error

  linux-flutter-smoke:
    name: Flutter native asset (Linux x64)
    needs: native-tls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-tls-*
          path: native-assets
      - run: bash tool/stage_ci_native_tls.sh native-assets
      - name: Create Linux smoke application
        run: |
          flutter create \
            --platforms=linux \
            --org dev.mssql \
            --project-name mssql_flutter_smoke \
            build/flutter-smoke
          cp .github/fixtures/flutter_smoke/pubspec.yaml \
            build/flutter-smoke/pubspec.yaml
          mkdir -p build/flutter-smoke/integration_test
          cp .github/fixtures/flutter_smoke/native_tls_smoke_test.dart \
            build/flutter-smoke/integration_test/native_tls_smoke_test.dart
          cd build/flutter-smoke
          flutter pub get
      - name: Build and inspect Linux application
        working-directory: build/flutter-smoke
        run: |
          set -euo pipefail
          flutter build linux --release
          HELPER=$(find build/linux -path \
            '*/bundle/lib/libmssql_tls.so' -print -quit)
          test -n "$HELPER"
          file "$HELPER"
          ldd "$HELPER"
      - name: Run Linux Flutter smoke test
        working-directory: build/flutter-smoke
        run: xvfb-run -a flutter test integration_test/native_tls_smoke_test.dart -d linux
      - name: Inspect Linux native asset packaging
        if: always()
        run: |
          find build/flutter-smoke/build/linux \
            -iname '*mssql_tls*' -print || true
          find build/flutter-smoke/.dart_tool \
            -iname '*mssql_tls*' -print || true

  windows-flutter-smoke:
    name: Flutter native asset (Windows x64)
    needs: native-tls
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-tls-*
          path: native-assets
      - run: bash tool/stage_ci_native_tls.sh native-assets
      - name: Create Windows smoke application
        shell: pwsh
        run: |
          flutter create `
            --platforms=windows `
            --org dev.mssql `
            --project-name mssql_flutter_smoke `
            build/flutter-smoke
          Copy-Item .github/fixtures/flutter_smoke/pubspec.yaml `
            build/flutter-smoke/pubspec.yaml -Force
          New-Item -ItemType Directory -Force `
            build/flutter-smoke/integration_test | Out-Null
          Copy-Item .github/fixtures/flutter_smoke/native_tls_smoke_test.dart `
            build/flutter-smoke/integration_test/native_tls_smoke_test.dart -Force
          Push-Location build/flutter-smoke
          flutter pub get
          Pop-Location
      - name: Build and inspect Windows application
        working-directory: build/flutter-smoke
        shell: pwsh
        run: |
          flutter build windows --release
          $helper = Get-ChildItem build/windows -Recurse -Filter mssql_tls.dll |
            Where-Object { $_.FullName -match 'runner[\\/]Release' } |
            Select-Object -First 1
          if ($null -eq $helper) {
            throw 'Packaged mssql_tls.dll was not found in the release application.'
          }
          $helper.FullName
          Get-FileHash $helper.FullName -Algorithm SHA256
      - name: Run Windows Flutter smoke test
        working-directory: build/flutter-smoke
        run: flutter test integration_test/native_tls_smoke_test.dart -d windows
      - name: Inspect Windows native asset packaging
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem build/flutter-smoke/build/windows -Recurse `
            -Filter '*mssql_tls*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Get-ChildItem build/flutter-smoke/.dart_tool -Recurse `
            -Filter '*mssql_tls*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

  android-flutter-smoke:
    name: Flutter native asset (Android x64 emulator)
    needs: [native-tls, android-native-tls]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-tls-*
          path: native-assets
      - run: bash tool/stage_ci_native_tls.sh native-assets
      - name: Create Android smoke application
        run: |
          flutter create \
            --platforms=android \
            --org dev.mssql \
            --project-name mssql_flutter_smoke \
            build/flutter-smoke
          cp .github/fixtures/flutter_smoke/pubspec.yaml \
            build/flutter-smoke/pubspec.yaml
          mkdir -p build/flutter-smoke/integration_test
          cp .github/fixtures/flutter_smoke/native_tls_smoke_test.dart \
            build/flutter-smoke/integration_test/native_tls_smoke_test.dart
          cd build/flutter-smoke
          flutter pub get
      - name: Build and inspect Android application
        working-directory: build/flutter-smoke
        run: |
          set -euo pipefail
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            unzip -l "$APK" | grep "lib/$abi/libmssql_tls.so"
          done
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android Flutter smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            cd build/flutter-smoke &&
            flutter test integration_test/native_tls_smoke_test.dart
            -d emulator-5554
      - name: Inspect Android native asset packaging
        if: always()
        run: |
          find build/flutter-smoke/build/app \
            -iname '*mssql_tls*' -print || true
          find build/flutter-smoke/.dart_tool \
            -iname '*mssql_tls*' -print || true

  apple-native-slices:
    name: Native TLS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple arm64
            os: macos-15
            artifact: apple-slices-arm64
            targets: macos-arm64 ios-device-arm64 ios-sim-arm64
            macos_path: dist/macos/arm64
            ios_paths: |
              dist/ios/iphoneos/arm64
              dist/ios/iphonesimulator/arm64
          - name: Apple x64
            os: macos-15-intel
            artifact: apple-slices-x64
            targets: macos-x64 ios-sim-x64
            macos_path: dist/macos/x86_64
            ios_paths: dist/ios/iphonesimulator/x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Build Apple native helpers
        run: bash tool/build_apple_native.sh ${{ matrix.targets }}
      - name: Inspect Apple helpers
        run: |
          set -euo pipefail
          while IFS= read -r library; do
            file "$library"
            otool -L "$library"
            otool -l "$library" | grep -A 5 LC_BUILD_VERSION
            diff <(sort native/apple_exports.txt) \
              <(nm -gjU "$library" | sort)
          done < <(find dist/macos dist/ios -name libmssql_tls.dylib -type f | sort)
      - run: dart pub get
      - name: Run Dart native TLS smoke test
        run: dart test test/native_tls_engine_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.macos_path }}
            ${{ matrix.ios_paths }}
            dist/macos/THIRD_PARTY_NOTICES.md
            dist/ios/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  apple-native-tls:
    name: Native TLS (Apple artifacts)
    needs: apple-native-slices
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apple-slices-*
          path: dist
          merge-multiple: true
      - name: Verify complete Apple matrix
        run: |
          set -euo pipefail
          for library in \
            dist/macos/arm64/libmssql_tls.dylib \
            dist/macos/x86_64/libmssql_tls.dylib \
            dist/ios/iphoneos/arm64/libmssql_tls.dylib \
            dist/ios/iphonesimulator/arm64/libmssql_tls.dylib \
            dist/ios/iphonesimulator/x86_64/libmssql_tls.dylib
          do
            test -f "$library"
            (cd "$(dirname "$library")" && shasum -a 256 --check SHA256SUMS)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mssql-tls-macos
          path: dist/macos/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mssql-tls-ios
          path: dist/ios/
          if-no-files-found: error

  apple-flutter-smoke:
    name: Flutter native asset (${{ matrix.name }})
    needs: [native-tls, android-native-tls, apple-native-tls]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 + iOS arm64
            os: macos-15
            test_ios: true
          - name: macOS x64
            os: macos-15-intel
            test_ios: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-tls-*
          path: native-assets
      - run: bash tool/stage_ci_native_tls.sh native-assets
      - name: Create smoke application
        run: |
          flutter create \
            --platforms=ios,macos \
            --org dev.mssql \
            --project-name mssql_apple_smoke \
            build/apple-smoke
          cp .github/fixtures/apple_smoke/pubspec.yaml \
            build/apple-smoke/pubspec.yaml
          mkdir -p build/apple-smoke/integration_test
          cp .github/fixtures/apple_smoke/native_tls_smoke_test.dart \
            build/apple-smoke/integration_test/native_tls_smoke_test.dart
          cd build/apple-smoke
          flutter pub get
      - name: Enable macOS network client
        shell: bash
        run: |
          set -euo pipefail
          for name in DebugProfile Release; do
            file="build/apple-smoke/macos/Runner/${name}.entitlements"
            /usr/libexec/PlistBuddy \
              -c "Add :com.apple.security.network.client bool true" \
              "$file"
          done
      - name: Build and inspect macOS application
        working-directory: build/apple-smoke
        run: |
          set -euo pipefail
          flutter build macos --release

          HELPER=$(find build/macos -path \
            '*/Contents/Frameworks/mssql_tls.framework/mssql_tls' \
            -print -quit)

          test -n "$HELPER"
          file -L "$HELPER"
          otool -l "$HELPER" | grep -A 5 LC_BUILD_VERSION
      - name: Run macOS Flutter smoke test
        working-directory: build/apple-smoke
        run: flutter test integration_test/native_tls_smoke_test.dart -d macos
      - name: Inspect macOS native asset packaging
        if: always()
        run: |
          find build/apple-smoke/build/macos \
            -iname '*mssql_tls*' -print || true

          find build/apple-smoke/.dart_tool \
            -iname '*mssql_tls*' -print || true

          find dist/macos \
            -name 'libmssql_tls.dylib' -print
      - name: Run iOS Simulator Flutter smoke test
        if: matrix.test_ios
        working-directory: build/apple-smoke
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for values in d.values() for x in values if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          flutter test integration_test/native_tls_smoke_test.dart -d "$DEVICE"
      - name: Build unsigned iOS device application
        if: matrix.test_ios
        working-directory: build/apple-smoke
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          HELPER=$(find build/ios/iphoneos -path \
            '*/Frameworks/mssql_tls.framework/mssql_tls' \
            -print -quit)
          test -n "$HELPER"
          file "$HELPER"
          otool -l "$HELPER" | grep -A 5 LC_BUILD_VERSION | grep 'platform 2'
