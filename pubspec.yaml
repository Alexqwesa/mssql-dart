name: mssql
description: A Dart driver for Microsoft SQL Server using the TDS 7.4 wire protocol.
version: 0.6.0-dev.0
homepage: https://github.com/kartikey321/mssql-dart
repository: https://github.com/kartikey321/mssql-dart
issue_tracker: https://github.com/kartikey321/mssql-dart/issues

environment:
  sdk: '>=3.14.0-165.0.dev <3.14.0-166.0.dev'

dependencies:
  async: ^2.11.0
  crypto: ^3.0.7
  http: ^1.2.0
  tls_fragment_secure_socket: ^0.1.0-dev.0

dependency_overrides:
  tls_fragment_secure_socket:
    path: packages/tls_fragment_secure_socket

false_secrets:
  - /docker/live/certs/server.key
  - /test/tvp_live_test.dart
  - /test/live/tvp_live_test.dart
  - /test/pool_ntlm_config_test.dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
